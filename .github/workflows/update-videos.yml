name: Update videos from YouTube

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube feed and build videos.json
        run: python .github/scripts/update_videos.py

      - name: Commit videos.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if git diff --cached --quiet; then
            echo "No video changes - skipping commit"
          else
            git commit -m "chore: auto-update videos from YouTube feed"
            git push
          fi
